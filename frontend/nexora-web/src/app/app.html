@if (showShell()) {
  <div class="nx-app" [class.nav-open]="navOpen()" [class.collapsed]="collapsed()">
    <nx-sidebar
      [user]="shellUser()"
      [groups]="navGroups()"
      [plan]="shellPlan()"
      (itemClick)="navOpen.set(false)"
      (logout)="logout()"
    />

    <button class="nx-scrim" aria-label="Fechar menu" (click)="navOpen.set(false)"></button>

    <section class="nx-workspace">
      <nx-topbar
        [title]="pageTitle()"
        [user]="shellUser()"
        (toggleNav)="toggleNav()"
        (logout)="logout()"
      />
      <main class="nx-content"><router-outlet /></main>
    </section>
  </div>
} @else {
  <main class="nx-public"><router-outlet /></main>
}
