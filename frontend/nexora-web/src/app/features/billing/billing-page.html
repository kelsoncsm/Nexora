<nx-page-header title="Plano e Assinatura" subtitle="Gere um checkout e acompanhe suas cobranças." />

<div class="nx-grid nx-grid--2">
  <nx-card heading="Novo checkout" icon="i-card">
    <form (ngSubmit)="checkout()">
      <nx-form-field label="Método de pagamento">
        <select class="nx-form-control" [(ngModel)]="method" name="method">
          <option value="Pix">Pix</option>
          <option value="Boleto">Boleto</option>
          <option value="CreditCard">Cartão de crédito</option>
        </select>
      </nx-form-field>
      <nx-form-field label="E-mail do pagador">
        <input class="nx-form-control" [(ngModel)]="email" name="email" type="email" required placeholder="pagador@empresa.com.br" />
      </nx-form-field>
      <div class="nx-form-actions">
        <span></span>
        <button nx-button type="submit">Criar checkout</button>
      </div>

      @if (result(); as r) {
        <div class="nx-alert nx-alert--info" style="margin-top: var(--nx-space-4)">
          <div>
            <strong>{{ r.amount }} {{ r.currency }}</strong> · {{ r.status }}
            @if (r.checkoutUrl) {
              · <a [href]="r.checkoutUrl" class="nx-btn-link">Abrir pagamento</a>
            }
          </div>
        </div>
      }
    </form>
  </nx-card>

  <div>
    <h2 class="nx-section-title">Cobranças</h2>
    <nx-data-table
      [empty]="!invoices().length"
      emptyIcon="i-dollar"
      emptyTitle="Nenhuma cobrança"
      emptyDescription="As cobranças aparecerão aqui após o primeiro ciclo."
    >
      <table class="nx-table" style="min-width: 0">
        <thead>
          <tr>
            <th>Status</th>
            <th>Valor</th>
          </tr>
        </thead>
        <tbody>
          @for (x of invoices(); track x.id) {
            <tr>
              <td data-label="Status"><nx-badge [tone]="badge(x.status)">{{ x.status }}</nx-badge></td>
              <td data-label="Valor">{{ x.amount }} {{ x.currency }}</td>
            </tr>
          }
        </tbody>
      </table>
    </nx-data-table>
  </div>
</div>
