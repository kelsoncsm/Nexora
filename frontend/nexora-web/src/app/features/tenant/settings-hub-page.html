<nx-page-header title="Configurações" subtitle="Central de ajustes da sua empresa e da sua conta." />

  @for (g of groups(); track g.name) {
    <section class="nx-hub-section">
      <h2 class="nx-hub-section-title">{{ g.name }}</h2>
      <div class="nx-hub-grid">
        @for (c of g.cards; track c.route) {
          <a class="nx-card nx-hub-card" [routerLink]="c.route">
            <span class="nx-hub-icon"
              ><svg class="nx-ico"><use [attr.href]="'#' + c.icon" /></svg
            ></span>
            <strong>{{ c.title }}</strong>
            <span class="nx-form-hint">{{ c.description }}</span>
            <span class="nx-hub-go"><svg class="nx-ico"><use href="#i-chevron" /></svg></span>
          </a>
        }
      </div>
    </section>
  }
