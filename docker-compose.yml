name: nexora

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saas_dev}
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      # ADR-0022: shared saas_dev database, application confined to the "nexora" schema via Search Path.
      ConnectionStrings__NexoraDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-saas_dev};Username=${POSTGRES_USER:-nexora};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local .env file};Search Path=nexora
      Identity__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in a local .env file}
      Administration__BootstrapAdminEmail: ${PLATFORM_ADMIN_EMAIL:-}
      Payments__MercadoPago__AccessToken: ${MERCADOPAGO_ACCESS_TOKEN:-}
      Payments__MercadoPago__WebhookSecret: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      Email__Provider: ${EMAIL_PROVIDER:-Fake}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__ReplyTo: ${EMAIL_REPLY_TO:-}
      Email__ResendApiKey: ${RESEND_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./frontend/nexora-web
      dockerfile: Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
