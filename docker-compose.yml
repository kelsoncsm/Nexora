name: nexora

# ─────────────────────────────────────────────────────────────────────────────
# Nexora — stack local integrada (API + Web).
#
# O PostgreSQL NÃO é definido aqui. O banco é o container COMPARTILHADO
# `saas-postgres` (repos/infra/docker-compose.yml): PostgreSQL 18, database
# `saas_dev`, um schema por aplicação (o Nexora vive no schema `nexora`).
#
#   Subir o banco (uma vez):   cd ../infra && docker compose up -d
#   Subir a stack do Nexora:   docker compose up -d --build
#
# Backend rodando direto no host (F5 / dotnet run) usa Host=localhost:5432 via
# user-secrets (scripts/set-user-secrets.ps1). Aqui, dentro do Docker, a API
# entra na rede `saas-network` e alcança o banco por Host=saas-postgres.
# ─────────────────────────────────────────────────────────────────────────────

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      # ADR-0022: database compartilhada saas_dev, aplicação confinada ao schema "nexora" via Search Path.
      ConnectionStrings__NexoraDatabase: Host=saas-postgres;Port=5432;Database=${POSTGRES_DB:-saas_dev};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};Search Path=nexora
      Identity__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in a local .env file}
      Administration__BootstrapAdminEmail: ${PLATFORM_ADMIN_EMAIL:-}
      Payments__MercadoPago__AccessToken: ${MERCADOPAGO_ACCESS_TOKEN:-}
      Payments__MercadoPago__WebhookSecret: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      Email__Provider: ${EMAIL_PROVIDER:-Fake}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__ReplyTo: ${EMAIL_REPLY_TO:-}
      Email__ResendApiKey: ${RESEND_API_KEY:-}
    ports:
      - "8080:8080"
    networks:
      - saas-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./frontend/nexora-web
      dockerfile: Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  saas-network:
    external: true
    name: saas-network
